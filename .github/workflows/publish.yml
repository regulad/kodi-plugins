name: Publish Kodi repository

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # Mints the GitHub OIDC token that kodi-plugins' Tailscale federated identity
  # accepts, so no long-lived Tailscale secret is stored.
  id-token: write

concurrency:
  group: publish-helix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out publishing tools
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Check out Helix sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/helix' && github.sha || 'helix' }}
          path: sources
          persist-credentials: false
      - name: Check out pinned repository generator (2.3.8)
        uses: actions/checkout@v4
        with:
          repository: chadparry/kodi-repository.chad.parry.org
          ref: 27c38eddda89e626d05b029edb29fbc83bb27201
          path: upstream
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SSH and DNS utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client dnsutils
      - name: Test publishing helpers
        run: python -m unittest discover -s tests -v
      - name: Package and validate repository
        run: python tools/build.py sources upstream/tools/create_repository.py dist
      - name: Check Python 2.7 syntax without importing add-ons
        run: |
          docker run --rm -v "$PWD/sources:/sources:ro" python:2.7.18-slim python -c '
          import os
          for root, dirs, files in os.walk("/sources"):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              for name in files:
                  if name.endswith(".py"):
                      path = os.path.join(root, name)
                      with open(path, "rb") as source:
                          compile(source.read(), path, "exec")
          '
      - name: Test Helix browsing and playback
        run: |
          docker run --rm -v "$PWD/sources:/sources:ro" -w /sources \
            python:2.7.18-slim python -B -m unittest discover -s tests -v
      - name: Save installable repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - name: Join Tailscale with subnet routes and MagicDNS
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-kodi
          hostname: kodi-publish-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Ensure subnet routes and MagicDNS are enabled
        run: sudo tailscale set --accept-routes=true --accept-dns=true
      # The SSH key publishing logs in with is kept in publish.sops.yaml,
      # encrypted to this repository's own age key (the SOPS_AGE_KEY secret)
      # and Parker's.
      - name: Install SOPS
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/sops" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sops"
      - name: Publish over SSH
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SSH_KEY_HOST: ${{ secrets.SSH_KEY_HOST }}
          SSH_KEY_USER: ${{ secrets.SSH_KEY_USER }}
          STATIC_FILE_BASE: ${{ secrets.STATIC_FILE_BASE }}
        run: |
          SSH_KEY_BLOB="$("$RUNNER_TEMP/sops" decrypt --extract '["ssh_key"]' publish.sops.yaml)"
          export SSH_KEY_BLOB
          unset SOPS_AGE_KEY
          python tools/deploy.py dist
