# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: kodi-plugins
  description: >-
    Kodi add-on sources and repository publishing
  homepage: ""
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: kodi, kodi-addons, kodi-repository, kodi-helix, jellyfin, apple-tv, appletv3, live-tv, python
  default_branch: master

  # workflows/dependabot-auto-merge.yml turns it on for Dependabot's minor and patch updates.
  allow_auto_merge: true

labels:
  # Dependabot's, on its pull requests: its one ecosystem here is .github/dependabot.yml's GitHub Actions.
  - name: github_actions
    color: "000000"
    description: Pull requests that update GitHub Actions code

branches:
  - name: master
    # https://docs.github.com/en/rest/reference/repos#update-branch-protection
    # Branch Protection settings. Set to null to disable
    protection:
      # Required. Require at least one approving review on a pull request, before merging. Set to null to disable.
      # Off: Dependabot's minor and patch updates merge on the required checks alone.
      required_pull_request_reviews: null
      # Required. Require status checks to pass before merging. Set to null to disable
      required_status_checks:
        # Required. Require branches to be up to date before merging.
        # Off: Dependabot doesn't rebase a PR just because master moved, so a stale PR would never merge.
        strict: false
        # Required. The list of status checks to require in order to merge into this branch
        # The jobs in workflows/check.yml, by name, and publish.yml's, which packages and validates without
        # publishing on a pull request.
        contexts:
          - actionlint
          - publish
      # Required. Enforce all configured restrictions for administrators. Set to true to enforce required status checks for repository administrators. Set to null to disable.
      # Off: Parker still pushes to master directly.
      enforce_admins: false
      # Required. Restrict who can push to this branch. Team and user restrictions are only available for organization-owned repositories. Set to null to disable.
      # Off: this is a personal repository, where GitHub rejects user and team restrictions, and with them the whole
      # protection.
      restrictions: null
